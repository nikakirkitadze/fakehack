[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fakehack"
version = "1.0.0"
description = "A zero-dependency terminal 'you've been hacked' prank screen."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Nika Kirkitadze" }]
keywords = ["prank", "terminal", "cli", "ascii-art", "hacker", "tui", "fun"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://github.com/nikakirkitadze/fakehack"
Repository = "https://github.com/nikakirkitadze/fakehack"
Issues = "https://github.com/nikakirkitadze/fakehack/issues"

[project.scripts]
fakehack = "fakehack:main"

[tool.setuptools]
py-modules = ["fakehack"]
