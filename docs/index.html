<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SYSTEM COMPROMISED</title>
<meta name="description" content="A theatrical 'you've been hacked' prank screen — pure theater, touches nothing.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=VT323&display=swap">
<style>
  :root {
    color-scheme: dark;
    --void: #000000;
    --red: #ff2d2d;
    --red-hot: #ff6a6a;
    --blood: #8b0000;
    --cyan: #19ffe6;
    --dim: #b31212;
    --mono: "VT323", "Courier New", monospace;
    --display: "Orbitron", "Arial Black", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--void);
    color: var(--red);
    font-family: var(--mono);
    overflow: hidden;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
  }
  .screen {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: clamp(0.6rem, 2.4vh, 1.6rem);
    padding: clamp(1rem, 4vw, 3rem);
  }
  .scanlines, .vignette, .flicker { position: absolute; inset: 0; pointer-events: none; z-index: 50; }
  .scanlines {
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,0.35) 3px 4px);
    mix-blend-mode: multiply;
  }
  .vignette { background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.85) 100%); }
  .flicker { background: rgba(255,45,45,0.03); animation: flicker 3.2s infinite steps(1); }
  @keyframes flicker { 0%,92%,100%{opacity:0} 93%{opacity:1} 94%{opacity:0} 96%{opacity:.6} 97%{opacity:0} }

  .meta {
    display: flex; flex-wrap: wrap; gap: 0.4rem 1.6rem;
    font-size: clamp(1rem, 2.4vw, 1.6rem); letter-spacing: 0.08em;
    color: var(--dim); text-transform: uppercase; z-index: 10;
  }
  .meta .live { color: var(--red); animation: blink 1s steps(1) infinite; }

  .glitch {
    font-family: var(--display); font-weight: 900;
    font-size: clamp(2.6rem, 11.5vw, 11rem); line-height: 0.92; letter-spacing: 0.02em;
    text-align: center; text-wrap: balance; position: relative; color: var(--red);
    text-shadow: 0 0 18px rgba(255,45,45,0.55), 0 0 60px rgba(255,45,45,0.25); z-index: 10; margin: 0;
  }
  .glitch::before, .glitch::after { content: attr(data-text); position: absolute; inset: 0; overflow: hidden; }
  .glitch::before { color: var(--cyan); animation: glitch-a 2.6s infinite steps(2); clip-path: inset(0 0 55% 0); }
  .glitch::after { color: var(--red-hot); animation: glitch-b 1.9s infinite steps(2); clip-path: inset(55% 0 0 0); }
  @keyframes glitch-a { 0%,100%{transform:translate(0,0);opacity:.85} 20%{transform:translate(-4px,-2px)} 40%{transform:translate(3px,1px)} 60%{transform:translate(-2px,0);opacity:.6} }
  @keyframes glitch-b { 0%,100%{transform:translate(0,0);opacity:.85} 25%{transform:translate(4px,2px)} 55%{transform:translate(-3px,-1px)} 75%{transform:translate(2px,1px);opacity:.55} }

  .sub {
    text-align: center; font-family: var(--display); font-weight: 700;
    font-size: clamp(1rem, 3vw, 2rem); letter-spacing: 0.35em; margin: 0;
    color: var(--red-hot); animation: breathe 2s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100%{opacity:.55} 50%{opacity:1} }

  .terminal {
    font-family: var(--mono); font-size: clamp(1.1rem, 2.6vw, 1.9rem); line-height: 1.25;
    height: clamp(9rem, 26vh, 16rem); overflow: hidden;
    background: linear-gradient(180deg, rgba(139,0,0,0.08), rgba(0,0,0,0.5));
    border: 1px solid rgba(255,45,45,0.3); border-radius: 2px; padding: 0.6rem 1rem;
    max-width: 1100px; width: 100%; margin: 0 auto;
    box-shadow: inset 0 0 40px rgba(255,45,45,0.12); z-index: 10;
  }
  .terminal .line { white-space: pre-wrap; word-break: break-word; }
  .terminal .ok { color: var(--red-hot); }
  .terminal .warnc { color: #ffd23d; }
  .cursor { display: inline-block; width: 0.6ch; background: var(--red); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 0%,50%{opacity:1} 50.01%,100%{opacity:0} }

  .access {
    max-width: 1100px; width: 100%; margin: 0 auto; display: flex; align-items: center; gap: 1rem;
    font-family: var(--display); font-weight: 700; font-size: clamp(0.85rem, 2vw, 1.3rem);
    letter-spacing: 0.15em; z-index: 10;
  }
  .bar { flex: 1; height: clamp(14px, 2.4vh, 22px); border: 1px solid var(--red); background: rgba(255,45,45,0.08); position: relative; overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 0%; background: repeating-linear-gradient(90deg, var(--blood) 0 10px, var(--red) 10px 20px); box-shadow: 0 0 20px var(--red); transition: width 0.3s linear; }
  .pct { min-width: 4.5ch; text-align: right; font-variant-numeric: tabular-nums; }

  .warn {
    text-align: center; font-family: var(--display); font-weight: 900;
    font-size: clamp(1rem, 3.4vw, 2.4rem); letter-spacing: 0.1em; color: var(--red);
    text-shadow: 0 0 20px rgba(255,45,45,0.6); animation: blink 1.1s steps(1) infinite; z-index: 10; margin: 0;
  }
  .hint { text-align: center; font-family: var(--mono); font-size: clamp(1rem, 2.2vw, 1.5rem); color: var(--dim); letter-spacing: 0.15em; margin: 0; z-index: 10; }

  .reveal {
    position: absolute; inset: 0; z-index: 100; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1.2rem; background: var(--void); padding: 2rem; text-align: center;
  }
  .reveal[hidden] { display: none; }
  .reveal h1 {
    font-family: var(--display); font-weight: 900; font-size: clamp(3rem, 16vw, 13rem); margin: 0;
    color: var(--red); text-shadow: 0 0 30px rgba(255,45,45,0.6); animation: pop 0.5s cubic-bezier(.2,1.4,.4,1) both;
  }
  @keyframes pop { from{transform:scale(.4);opacity:0} to{transform:scale(1);opacity:1} }
  .reveal p { font-family: var(--mono); font-size: clamp(1.4rem, 4vw, 2.6rem); color: var(--red-hot); margin: 0; }
  .reveal button {
    margin-top: 1rem; font-family: var(--display); font-weight: 700; font-size: clamp(1rem, 2.4vw, 1.4rem);
    letter-spacing: 0.15em; color: var(--void); background: var(--red); border: none; padding: 0.7em 1.6em; border-radius: 2px; cursor: pointer; text-transform: uppercase;
  }
  @media (prefers-reduced-motion: reduce) {
    .flicker, .glitch::before, .glitch::after, .sub, .warn, .meta .live, .cursor, .reveal h1 { animation: none; }
    .glitch::before, .glitch::after { opacity: 0.4; }
  }
</style>
</head>
<body>
<div class="screen" id="screen">
  <div class="scanlines"></div>
  <div class="vignette"></div>
  <div class="flicker"></div>

  <main class="hack" id="hackView">
    <div class="meta">
      <span class="live">● REC</span>
      <span>NODE 0xC4-FF-19</span>
      <span>ROOT SHELL</span>
      <span id="clock">--:--:--</span>
    </div>
    <h1 class="glitch" data-text="SYSTEM COMPROMISED">SYSTEM COMPROMISED</h1>
    <p class="sub">UNAUTHORIZED ACCESS DETECTED</p>
    <div class="terminal" id="term" aria-hidden="true"></div>
    <div class="access">
      <span>ACCESS</span>
      <div class="bar"><span id="barFill"></span></div>
      <span class="pct" id="pct">0%</span>
    </div>
    <p class="warn">⚠ DO NOT POWER OFF THIS DEVICE ⚠</p>
    <p class="hint" id="hint">[ press any key · tap the screen ]</p>
  </main>

  <section class="reveal" id="revealView" hidden>
    <h1>GOTCHA!</h1>
    <p id="revealMsg">you just got pranked 😄</p>
    <button id="resetBtn" type="button">Run it again</button>
  </section>
</div>

<script>
  // ---- config from URL query params ----
  // ?word=PWNED  &target=LG-TV  &msg=got+you  &headline=BREACHED  &duration=30  &auto=1
  var q = new URLSearchParams(location.search);
  var CONFIG = {
    headline: (q.get("headline") || "SYSTEM COMPROMISED").toUpperCase(),
    subline: (q.get("sub") || "UNAUTHORIZED ACCESS DETECTED").toUpperCase(),
    target: q.get("target") || "DEVICE_7F",
    revealTitle: "GOTCHA!",
    revealMessage: q.get("msg") || "you just got pranked 😄",
    // auto-reveal after N seconds if ?duration=N or ?auto=1 (default 30s for auto)
    autoRevealMs: (function () {
      var d = parseFloat(q.get("duration"));
      if (!isNaN(d) && d > 0) return d * 1000;
      if (q.get("auto") === "1") return 30000;
      return 0; // 0 = stay until a key / tap
    })(),
  };

  var headlineEl = document.querySelector(".glitch");
  headlineEl.textContent = CONFIG.headline;
  headlineEl.setAttribute("data-text", CONFIG.headline);
  document.querySelector(".sub").textContent = CONFIG.subline;
  document.querySelector("#revealView h1").textContent = CONFIG.revealTitle;
  document.getElementById("revealMsg").textContent = CONFIG.revealMessage;

  var T = CONFIG.target;
  var LINES = [
    { t: "$ establishing uplink to " + T + " ...", c: "" },
    { t: "> handshake accepted  [ 0xA91F ]", c: "ok" },
    { t: "> bypassing firewall ........ DONE", c: "ok" },
    { t: "> escalating privileges → ROOT", c: "warnc" },
    { t: "> injecting payload 'ghost.bin'", c: "" },
    { t: "> scanning filesystem ......... 4,192 files", c: "" },
    { t: "> locating credentials vault ...", c: "" },
    { t: "> vault unlocked  ✓", c: "ok" },
    { t: "> mirroring display buffer ...", c: "" },
    { t: "> disabling remote input ...", c: "warnc" },
    { t: "> uploading to node 0xC4 ....... 100%", c: "ok" },
    { t: "> wiping trace logs ...", c: "" },
    { t: "> " + T + " is now UNDER CONTROL", c: "warnc" },
    { t: "$ awaiting operator command_", c: "" },
  ];

  var term = document.getElementById("term");
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var li = 0;
  function addLine() {
    var spec = LINES[li % LINES.length];
    var div = document.createElement("div");
    div.className = "line" + (spec.c ? " " + spec.c : "");
    div.textContent = spec.t;
    var prev = term.querySelector(".cursor");
    if (prev) prev.remove();
    var cur = document.createElement("span");
    cur.className = "cursor";
    cur.textContent = " ";
    div.appendChild(cur);
    term.appendChild(div);
    while (term.childNodes.length > 40) term.removeChild(term.firstChild);
    term.scrollTop = term.scrollHeight;
    li++;
  }
  for (var i = 0; i < 6; i++) addLine();
  var logTimer = setInterval(addLine, reduced ? 1200 : 520);

  var fill = document.getElementById("barFill");
  var pct = document.getElementById("pct");
  var p = 0;
  var barTimer = setInterval(function () {
    p += Math.random() * 6;
    if (p >= 100) { p = 100; pct.textContent = "GRANTED"; fill.style.width = "100%"; clearInterval(barTimer); return; }
    fill.style.width = p + "%";
    pct.textContent = Math.floor(p) + "%";
  }, 260);

  var clock = document.getElementById("clock");
  function tick() { clock.textContent = new Date().toLocaleTimeString([], { hour12: false }); }
  tick();
  var clockTimer = setInterval(tick, 1000);

  var hackView = document.getElementById("hackView");
  var revealView = document.getElementById("revealView");
  var screen = document.getElementById("screen");
  var revealed = false;
  var autoTimer = null;

  function tryFullscreen() {
    var el = document.documentElement;
    var fn = el.requestFullscreen || el.webkitRequestFullscreen;
    if (fn) { try { fn.call(el); } catch (e) {} }
  }

  function reveal() {
    if (revealed) return;
    revealed = true;
    clearInterval(logTimer); clearInterval(barTimer);
    if (autoTimer) clearTimeout(autoTimer);
    hackView.hidden = true;
    revealView.hidden = false;
    try { document.getElementById("resetBtn").focus(); } catch (e) {}
  }
  function reset() {
    location.reload();
  }

  window.addEventListener("keydown", function (e) {
    if (!revealed) { e.preventDefault(); reveal(); }
  });
  screen.addEventListener("click", function (e) {
    if (e.target && e.target.id === "resetBtn") { reset(); return; }
    tryFullscreen();
    if (!revealed) reveal();
  });
  document.getElementById("resetBtn").addEventListener("click", function (e) {
    e.stopPropagation(); reset();
  });

  if (CONFIG.autoRevealMs > 0) {
    autoTimer = setTimeout(reveal, CONFIG.autoRevealMs);
  }
</script>
</body>
</html>
